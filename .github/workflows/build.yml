name: APK bauen

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release-Signierung aktiv."
          else
            echo "::warning::Kein Secret SIGNING_KEYSTORE_BASE64 – APK wird mit Debug-Schlüssel signiert."
          fi

      - name: Tests
        run: ./gradlew --no-daemon :core-model:test

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Synvyropic-0.1.${VERSION_CODE}.apk"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Synvyropic-0.1.${{ github.run_number }}
          path: out/*.apk

      # Direkter Download aufs Handy: Release "latest-<branch>" wird bei jedem Push aktualisiert.
      - name: Download-Release aktualisieren
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Synvyropic – neuester Build (${{ github.ref_name }})"
          prerelease: true
          make_latest: false
          files: out/*.apk
          body: |
            Automatischer Build #${{ github.run_number }} von `${{ github.ref_name }}` (Commit ${{ github.sha }}).
            APK auf dem Handy herunterladen und installieren.
