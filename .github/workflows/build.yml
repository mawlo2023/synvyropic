name: APK bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Offizielle Version veröffentlichen (z. B. 1.0.0) – leer lassen für normalen Build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Bei Versions-Tags (v1.0.0) wird die Versionsnummer aus dem Tag übernommen
      VERSION_NAME: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Leerzeichen/Zeilenumbrüche entfernen, die beim Kopieren entstehen können
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
            echo "Länge des Secrets nach Bereinigung: ${#CLEAN} Zeichen"
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              echo "::warning::SIGNING_KEYSTORE_BASE64 ist kein gültiges Base64 (unvollständig kopiert?) – Fallback auf Debug-Schlüssel."
              exit 0
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
              echo "::warning::Keystore lässt sich nicht öffnen – Passwort oder Alias prüfen. Fallback auf Debug-Schlüssel."
              exit 0
            fi
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release-Signierung aktiv."
          else
            echo "::warning::Kein Secret SIGNING_KEYSTORE_BASE64 – APK wird mit Debug-Schlüssel signiert."
          fi

      - name: Tests
        run: ./gradlew --no-daemon :core-model:test :audio:test

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          if [ -n "$VERSION_NAME" ]; then NAME="${VERSION_NAME#v}"; else NAME="1.0.${VERSION_CODE}"; fi
          cp app/build/outputs/apk/release/app-release.apk "out/Synvyropic-${NAME}.apk"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Synvyropic-build-${{ github.run_number }}
          path: out/*.apk

      # Direkter Download aufs Handy: Release "latest-<branch>" wird bei jedem Push aktualisiert.
      - name: Download-Release aktualisieren
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Synvyropic – neuester Build (${{ github.ref_name }})"
          prerelease: true
          make_latest: false
          files: out/*.apk
          body: |
            Automatischer Build #${{ github.run_number }} von `${{ github.ref_name }}` (Commit ${{ github.sha }}).
            APK auf dem Handy herunterladen und installieren.

      # Versions-Tag (v1.0.0) oder manueller Start mit Version → dauerhaftes, offizielles Release
      - name: Versions-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Synvyropic ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}"
          prerelease: false
          make_latest: true
          files: out/*.apk
          body: |
            Offizielle Version von Synvyropic.
            APK auf dem Handy herunterladen und installieren (Updates lassen sich drüberinstallieren).
